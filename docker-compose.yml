services:
  mongodb:
    image: mongo:7.0
    container_name: documan-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - documan_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: documan-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/documan
      JWT_SECRET: ${JWT_SECRET:-documan_production_jwt_secret_must_be_32_chars_long}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - api_uploads:/app/apps/api/uploads
    networks:
      - documan_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: documan-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - documan_net

volumes:
  mongodb_data:
    driver: local
  api_uploads:
    driver: local

networks:
  documan_net:
    driver: bridge
